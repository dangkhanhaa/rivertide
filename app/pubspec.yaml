name: rivertide
description: "RiverTide — mực nước, thủy triều và giờ câu cá."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

# Only packages listed in PROJECT.md 5.1 are allowed here (CLAUDE.md 3.2).
dependencies:
  collection: ^1.19.1
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  go_router: ^18.1.3
  home_widget: ^0.10.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  maplibre_gl: ^0.28.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tide/
    - assets/data/
